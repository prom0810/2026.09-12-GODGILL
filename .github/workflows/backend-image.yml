name: Backend Image

# main에 backend 코드가 머지되면 컨테이너 이미지를 빌드해 GHCR에 올린다.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set image name and tag
        id: meta
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/godgill-backend" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## 백엔드 이미지 빌드 완료"
            echo
            echo "- 이미지: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- 클러스터 반영(k8s-cp에서):"
            echo
            echo '```'
            echo "kubectl set image deploy/godgill-backend backend=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"