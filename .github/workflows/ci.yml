name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle.properties
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Test and build backend
        run: bash ./gradlew build --no-daemon --stacktrace

      - name: Upload backend reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: backend/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/*/*.gradle*
            android/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Test, lint, and build Android apps
        run: >
          bash ./gradlew
          :mobile:testDebugUnitTest
          :mobile:lintDebug
          :mobile:assembleDebug
          :wear:testDebugUnitTest
          :wear:lintDebug
          :wear:assembleDebug
          --no-daemon
          --stacktrace

      - name: Upload Android reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/mobile/build/reports/
            android/wear/build/reports/
          if-no-files-found: ignore
          retention-days: 7
