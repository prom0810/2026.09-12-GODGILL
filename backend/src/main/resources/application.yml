spring:
  application:
    name: safewalk-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # 제보 사진 업로드 크기 제한. 사진 1장 10MB(Supabase 버킷 제한과 동일), 요청 전체는 사진 3장 + 여유분.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB

  jpa:
    hibernate:
      # DB 테이블(10개)은 pgAdmin에서 이미 직접 생성해서 관리 중이므로
      # Hibernate가 스키마를 만들거나 바꾸지 않고, Entity와 실제 DB 구조가
      # 일치하는지 검증만 하도록 validate로 고정한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 크기 제한을 넘은 업로드도 끝까지 받아서 413 응답을 정상적으로 돌려주기 위한 값
    max-swallow-size: 40MB

# 로그인/회원가입 성공 시 발급하는 JWT 서명 키.
# 운영/공유 환경에서는 반드시 .env의 JWT_SECRET으로 재정의할 것 — 아래 기본값은 로컬 개발용 예시일 뿐이다.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-env-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: debug

# 제보 사진 저장소. 값은 backend/.env에서 읽는다 (.env.example 참고).
#  - STORAGE_TYPE=supabase : Supabase Storage 사용 (STORAGE_ENDPOINT 등 4개 값 필요)
#  - STORAGE_TYPE=local 또는 미설정 : 개발용으로 서버 PC의 폴더(STORAGE_LOCAL_DIR)에 저장
storage:
  type: ${STORAGE_TYPE:local}
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:risk-report-images}
  signed-url-ttl-minutes: ${STORAGE_SIGNED_URL_TTL_MINUTES:10}
  local-dir: ${STORAGE_LOCAL_DIR:./local-storage}
