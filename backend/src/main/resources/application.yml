spring:
  application:
    name: safewalk-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # DB 테이블(10개)은 pgAdmin에서 이미 직접 생성해서 관리 중이므로
      # Hibernate가 스키마를 만들거나 바꾸지 않고, Entity와 실제 DB 구조가
      # 일치하는지 검증만 하도록 validate로 고정한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

# 로그인/회원가입 성공 시 발급하는 JWT 서명 키.
# 운영/공유 환경에서는 반드시 .env의 JWT_SECRET으로 재정의할 것 — 아래 기본값은 로컬 개발용 예시일 뿐이다.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-env-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: debug
