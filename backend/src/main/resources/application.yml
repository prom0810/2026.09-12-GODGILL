spring:
  application:
    name: safewalk-backend

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # JDBC batch INSERT를 여러 행 INSERT 한 문장으로 합쳐 보낸다 (경로 저장 RouteWriter가 사용).
        reWriteBatchedInserts: true

  # 제보 사진 업로드 크기 제한. 사진 1장 10MB(Supabase 버킷 제한과 동일), 요청 전체는 사진 3장 + 여유분.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 35MB

  jpa:
    hibernate:
      # DB 테이블(10개)은 pgAdmin에서 이미 직접 생성해서 관리 중이므로
      # Hibernate가 스키마를 만들거나 바꾸지 않고, Entity와 실제 DB 구조가
      # 일치하는지 검증만 하도록 validate로 고정한다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 크기 제한을 넘은 업로드도 끝까지 받아서 413 응답을 정상적으로 돌려주기 위한 값
    max-swallow-size: 40MB

# 로그인/회원가입 성공 시 발급하는 JWT 서명 키.
# 운영/공유 환경에서는 반드시 .env의 JWT_SECRET으로 재정의할 것 — 아래 기본값은 로컬 개발용 예시일 뿐이다.
jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-please-override-in-env-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: debug

# 제보 사진 저장소. 값은 backend/.env에서 읽는다 (.env.example 참고).
#  - STORAGE_TYPE=supabase : Supabase Storage 사용 (STORAGE_ENDPOINT 등 4개 값 필요)
#  - STORAGE_TYPE=local 또는 미설정 : 개발용으로 서버 PC의 폴더(STORAGE_LOCAL_DIR)에 저장
storage:
  type: ${STORAGE_TYPE:local}
  endpoint: ${STORAGE_ENDPOINT:}
  region: ${STORAGE_REGION:}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:risk-report-images}
  signed-url-ttl-minutes: ${STORAGE_SIGNED_URL_TTL_MINUTES:10}
  local-dir: ${STORAGE_LOCAL_DIR:./local-storage}

# 푸시 알림(FCM). 값은 backend/.env에서 읽는다 (.env.example 참고).
#  - FIREBASE_CREDENTIALS_PATH 있음 : 그 서비스 계정 키로 실제 FCM 발송
#  - 없음(빈 값)                    : 발송 내용을 서버 로그에만 출력 (키 없는 팀원도 bootRun 가능)
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# 개발용 API. 운영 배포에서는 false로 둘 것.
#  - POST /api/dev/push-test : 내 기기로 테스트 푸시 보내기
dev:
  push-test-enabled: ${DEV_PUSH_TEST_ENABLED:false}

# SOS 위치 공유 시간 설정 (초). 테스트할 때 .env에서 짧게 줄일 수 있다.
#  - stale  : 위치가 이 시간 안 오면 보호자 화면에 "마지막 위치" 표시 (SSE location_stale)
#  - lost   : 이 시간 안 오면 보호자에게 "위치 수신 끊김" 푸시 1회
#  - auto-close : 발생 후 이 시간이 지나면 자동 종료
emergency:
  stale-seconds: ${EMERGENCY_STALE_SECONDS:30}
  lost-seconds: ${EMERGENCY_LOST_SECONDS:180}
  auto-close-seconds: ${EMERGENCY_AUTO_CLOSE_SECONDS:7200}
  watchdog-interval-ms: ${EMERGENCY_WATCHDOG_INTERVAL_MS:5000}
  sse-timeout-minutes: ${EMERGENCY_SSE_TIMEOUT_MINUTES:30}

# 경로 안내 기록 보관·정리 (RouteCleanupJob). .env에서 바꿀 수 있다.
#  - stale-in-progress-hours : 안내 중으로 이 시간이 지나면 자동 취소
#  - detail-retention-days    : 이 기간이 지나면 경유 지점·구간·시설을 지우고 요약(경로, 출발·도착)만 남김
#  - delete-after-days        : 이 기간이 지나면 경로를 완전히 삭제 (detail-retention-days보다 커야 함)
#  - cleanup-cron             : 보관 기간 정리 실행 시각 (한국 시각, 기본 매일 04:10)
route:
  stale-in-progress-hours: ${ROUTE_STALE_IN_PROGRESS_HOURS:6}
  stale-check-interval-ms: ${ROUTE_STALE_CHECK_INTERVAL_MS:600000}
  detail-retention-days: ${ROUTE_DETAIL_RETENTION_DAYS:65}
  delete-after-days: ${ROUTE_DELETE_AFTER_DAYS:365}
  cleanup-cron: ${ROUTE_CLEANUP_CRON:0 10 4 * * *}
  cleanup-batch-size: ${ROUTE_CLEANUP_BATCH_SIZE:500}

# 웨어러블 연결 (WearableService). .env에서 바꿀 수 있다.
#  - connection-stale-hours : 다른 계정에서 연결 중인 워치라도 연결 상태가 이 시간 넘게 바뀌지 않았고
#                             그 계정이 경로 안내 중이 아니면 해제하고 새 계정에 연결 (기본 24시간)
wearable:
  connection-stale-hours: ${WEARABLE_CONNECTION_STALE_HOURS:24}

# 워치 센서 수집 (sensor 패키지). 심박 이상 SOS 동안만 워치 배치를 받아 심박만 읽는다.
#  - SOS 발생 당시·종료 시 심박을 Redis에 두었다가 SOS 종료 때 bpm_log에 저장 (경로 안내 중 평소에는 받지 않음)
#  - max-batch-bytes : gzip을 푼 배치 최대 크기
sensor:
  max-batch-bytes: ${SENSOR_MAX_BATCH_BYTES:1048576}
