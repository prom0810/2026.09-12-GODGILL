apiVersion: apps/v1
kind: Deployment
metadata:
  name: godgill-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: godgill-backend
  template:
    metadata:
      labels:
        app: godgill-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/ikunkun17/godgill-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: godgill-backend
          env:
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: STORAGE_TYPE
              value: local
            - name: JAVA_OPTS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: godgill-backend
spec:
  type: NodePort
  selector:
    app: godgill-backend
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

